services:
  - type: web
    name: romear-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DATABASE_URL
        sync: false
      - key: AUTH_CODE_SECRET
        generateValue: true
